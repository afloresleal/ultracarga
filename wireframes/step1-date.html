<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecciona Fecha - Ultracarga</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container-fluid px-4">
      <div class="d-flex justify-content-between align-items-center py-3">
        <a href="index.html" class="header__logo">
          <img src="ultra-carga-horizontal_logo-blanco.png" alt="Ultracarga">
        </a>
        <select class="form-select form-select-sm" style="width: auto; background-color: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.2);">
          <option value="es">ES</option>
          <option value="en">EN</option>
        </select>
      </div>
    </div>
  </header>

  <!-- PROGRESS BAR -->
  <div class="progress-bar-wizard">
    <div class="progress-step progress-step--active">
      <div class="progress-step__number">1</div>
      <div class="progress-step__label">Fecha</div>
    </div>
    <div class="progress-step">
      <div class="progress-step__number">2</div>
      <div class="progress-step__label">Horario</div>
    </div>
    <div class="progress-step">
      <div class="progress-step__number">3</div>
      <div class="progress-step__label">Vehículo</div>
    </div>
    <div class="progress-step">
      <div class="progress-step__number">4</div>
      <div class="progress-step__label">Datos</div>
    </div>
    <div class="progress-step">
      <div class="progress-step__number">5</div>
      <div class="progress-step__label">Pago</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="container py-4" style="max-width: 800px;">
    <h2 class="h4 fw-bold text-uc-secondary mb-4">Selecciona la fecha de tu viaje</h2>

    <!-- CALENDAR -->
    <div class="calendar mb-4">
      <div class="calendar__header">
        <button class="calendar__nav-btn" onclick="previousMonth()">←</button>
        <div class="calendar__month" id="currentMonth">Diciembre 2025</div>
        <button class="calendar__nav-btn" onclick="nextMonth()">→</button>
      </div>

      <div class="calendar__days-header">
        <div class="calendar__day-label">L</div>
        <div class="calendar__day-label">M</div>
        <div class="calendar__day-label">M</div>
        <div class="calendar__day-label">J</div>
        <div class="calendar__day-label">V</div>
        <div class="calendar__day-label">S</div>
        <div class="calendar__day-label">D</div>
      </div>

      <div class="calendar__days" id="calendarDays">
        <!-- Days will be generated by JavaScript -->
      </div>

      <div class="calendar__legend">
        <div class="calendar__legend-item">
          <span class="calendar__legend-dot calendar__legend-dot--high"></span>
          Alta disponibilidad
        </div>
        <div class="calendar__legend-item">
          <span class="calendar__legend-dot calendar__legend-dot--medium"></span>
          Espacios limitados
        </div>
        <div class="calendar__legend-item">
          <span class="calendar__legend-dot calendar__legend-dot--low"></span>
          Pocas plazas
        </div>
        <div class="calendar__legend-item">
          <span class="calendar__legend-dot calendar__legend-dot--full"></span>
          No disponible
        </div>
      </div>
    </div>

    <!-- SELECTED DATE DISPLAY -->
    <div id="selectedDateDisplay" class="card mb-4" style="display: none;">
      <div class="card-body">
        <div class="text-muted small mb-2">Fecha seleccionada:</div>
        <div class="text-center py-3">
          <div class="fs-5 fw-bold text-uc-secondary" id="selectedDateText">
            Viernes, 29 de Diciembre 2025
          </div>
          <div class="d-flex align-items-center justify-content-center gap-2 mt-2">
            <span class="badge rounded-pill" style="background-color: var(--color-success); width: 10px; height: 10px; padding: 0;"></span>
            <small class="text-muted">Alta disponibilidad</small>
          </div>
        </div>
      </div>
    </div>

    <!-- NAVIGATION BUTTONS -->
    <button class="btn btn-primary btn-lg w-100 mb-3" id="continueBtn" onclick="goToSchedule()" disabled style="display: none;">
      Continuar
    </button>

    <a href="index.html" class="d-inline-flex align-items-center gap-1 text-decoration-none text-muted small">
      ← Anterior
    </a>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JAVASCRIPT -->
  <script>
    let selectedDate = null;

    // Initialize with TODAY'S month and year
    const today = new Date();
    let currentMonth = today.getMonth(); // Current month (0-indexed)
    let currentYear = today.getFullYear(); // Current year

    const months = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    const daysOfWeek = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    // Generate calendar
    function generateCalendar() {
      console.log('Generating calendar for', months[currentMonth], currentYear);

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const calendarDays = document.getElementById('calendarDays');
      const monthDisplay = document.getElementById('currentMonth');

      if (!calendarDays) {
        console.error('Calendar container not found!');
        return;
      }

      calendarDays.innerHTML = '';
      monthDisplay.textContent = `${months[currentMonth]} ${currentYear}`;

      // Get today for comparison
      const today = new Date();
      const todayYear = today.getFullYear();
      const todayMonth = today.getMonth();
      const todayDay = today.getDate();

      // Empty cells for days before month starts
      for (let i = 0; i < firstDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'calendar__day';
        emptyDay.style.visibility = 'hidden';
        calendarDays.appendChild(emptyDay);
      }

      // Generate days
      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement('div');
        dayElement.className = 'calendar__day';
        dayElement.textContent = day;
        dayElement.style.cursor = 'pointer';

        // Check if this date is in the past
        let isPast = false;

        if (currentYear < todayYear) {
          isPast = true;
        } else if (currentYear === todayYear) {
          if (currentMonth < todayMonth) {
            isPast = true;
          } else if (currentMonth === todayMonth) {
            if (day < todayDay) {
              isPast = true;
            }
          }
        }

        if (isPast) {
          // Past dates are disabled
          dayElement.classList.add('calendar__day--disabled');
          dayElement.style.cursor = 'not-allowed';
          dayElement.style.opacity = '0.3';
        } else {
          // TODAY and FUTURE dates - add availability classes (simulated)
          const availability = Math.random();
          if (availability > 0.7) {
            dayElement.classList.add('calendar__day--high');
          } else if (availability > 0.4) {
            dayElement.classList.add('calendar__day--medium');
          } else if (availability > 0.15) {
            dayElement.classList.add('calendar__day--low');
          } else {
            dayElement.classList.add('calendar__day--full', 'calendar__day--disabled');
            dayElement.style.cursor = 'not-allowed';
          }

          // Click handler for available dates (not full/disabled)
          if (!dayElement.classList.contains('calendar__day--disabled')) {
            dayElement.addEventListener('click', function() {
              selectDate(day, dayElement);
            });

            // Add hover effect
            dayElement.addEventListener('mouseenter', function() {
              if (!this.classList.contains('calendar__day--disabled')) {
                this.style.backgroundColor = '#F3F4F6';
              }
            });

            dayElement.addEventListener('mouseleave', function() {
              if (!this.classList.contains('calendar__day--selected')) {
                this.style.backgroundColor = '';
              }
            });
          }
        }

        calendarDays.appendChild(dayElement);
      }
    }

    // Select date
    function selectDate(day, element) {
      // Remove previous selection
      document.querySelectorAll('.calendar__day').forEach(d => {
        d.classList.remove('calendar__day--selected');
      });

      // Add selection
      element.classList.add('calendar__day--selected');

      // Store selected date
      selectedDate = new Date(currentYear, currentMonth, day);

      // Update display
      const dayOfWeek = daysOfWeek[selectedDate.getDay()];
      const dateText = `${dayOfWeek}, ${day} de ${months[currentMonth]} ${currentYear}`;
      document.getElementById('selectedDateText').textContent = dateText;
      document.getElementById('selectedDateDisplay').style.display = 'block';

      // Enable continue button
      document.getElementById('continueBtn').disabled = false;

      // Store in localStorage
      localStorage.setItem('selectedDate', selectedDate.toISOString());

      // Auto-navigate to next step after short delay (visual feedback)
      setTimeout(() => {
        window.location.href = 'step3-schedule.html';
      }, 300);
    }

    // Navigate months
    function previousMonth() {
      if (currentMonth === 0) {
        currentMonth = 11;
        currentYear--;
      } else {
        currentMonth--;
      }
      generateCalendar();
    }

    function nextMonth() {
      if (currentMonth === 11) {
        currentMonth = 0;
        currentYear++;
      } else {
        currentMonth++;
      }
      generateCalendar();
    }

    // Navigate to schedule
    function goToSchedule() {
      if (selectedDate) {
        window.location.href = 'step3-schedule.html';
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', generateCalendar);
    } else {
      generateCalendar();
    }
  </script>

</body>
</html>
